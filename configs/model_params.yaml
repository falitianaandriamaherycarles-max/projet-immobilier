# Hyperparamètres du modèle

model_type: random_forest

random_forest:
  n_estimators: 300
  max_depth: 18
  min_samples_split: 4
  min_samples_leaf: 2
  max_features: 0.6
  n_jobs: -1
  random_state: 42

tuning_grid:
  n_estimators: [200, 300, 500]
  max_depth: [12, 18, 24]
  min_samples_leaf: [1, 2, 4]
