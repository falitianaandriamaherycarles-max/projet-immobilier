version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: immobilier-api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MODEL_VERSION=docker
    depends_on:
      - mlflow
    restart: unless-stopped
    networks:
      - immobilier-net

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile
    container_name: immobilier-mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    restart: unless-stopped
    networks:
      - immobilier-net

  evidently:
    build:
      context: .
      dockerfile: docker/evidently/Dockerfile
    container_name: immobilier-evidently
    ports:
      - "8050:8050"
    volumes:
      - ./data:/app/data:ro
      - ./reports:/app/reports
    restart: unless-stopped
    networks:
      - immobilier-net

  nginx:
    image: nginx:1.27-alpine
    container_name: immobilier-nginx
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - mlflow
      - evidently
    restart: unless-stopped
    networks:
      - immobilier-net

volumes:
  mlflow-data:

networks:
  immobilier-net:
    driver: bridge
